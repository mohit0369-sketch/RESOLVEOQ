[build]
builder = "nixpacks"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "backend"
source = "backend"
[services.backend.variables]
PORT = "8000"
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
SECRET_KEY = "${{SECRET_KEY}}"
ACCESS_TOKEN_EXPIRE_MINUTES = "60"

[[services]]
name = "ai-agent"
source = "ai_agent"
[services.ai-agent.variables]
PORT = "8001"
BACKEND_URL = "https://${{services.backend.RAILWAY_PUBLIC_DOMAIN}}"

[[services]]
name = "frontend"
source = "customer-support-ai-frontend-signin-ready"
[services.frontend.variables]
VITE_API_BASE_URL = "https://${{services.backend.RAILWAY_PUBLIC_DOMAIN}}"